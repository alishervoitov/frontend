map $http_x_forwarded_proto $fwd_proto {
    default $scheme;
    https   https;
}

# "main" formati + vaqt va so'rov hajmi (pentest 2026-10-19, 3-band: DoS tahlili uchun).
# Yangi maydonlar oxirida, shuning uchun mavjud ustunlar o'rni o'zgarmaydi.
log_format timed '$remote_addr - $remote_user [$time_local] "$request" '
                 '$status $body_bytes_sent "$http_referer" '
                 '"$http_user_agent" "$http_x_forwarded_for" '
                 'rt=$request_time len=$request_length ut=$upstream_response_time';

server {
    listen 80;
    server_name _;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Forwarded-For;
    server_tokens off;
    client_max_body_size 12m;
    access_log /var/log/nginx/access.log timed;

    root /usr/share/nginx/html;
    index index.html;

    # Xavfsizlik sarlavhalari (nginx: location ichida add_header bo'lsa,
    # server darajasidagilar meros bo'lmaydi, shuning uchun u yerda takrorlanadi)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Avatar yuklash: so'rov tanasi Django'ga yetmasdan cheklanadi (pentest 2026-10-19, 3-band).
    # Regex slash'siz /api/auth/me/avatar ni ham qamraydi, aks holda u /api/ dagi 12m bilan o'tardi.
    location ~ ^/api/auth/me/avatar/?$ {
        client_max_body_size 2m;
        client_body_timeout 10s;

        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $fwd_proto;

        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;

        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $fwd_proto;

        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;

        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }

    # Django admin. /admin/... manzillari React ilovasining admin sahifalari (pastdagi try_files),
    # aks holda sahifa yangilanganda so'rov Django'ga ketib "Not Found" chiqar edi.
    location /django-admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $fwd_proto;

        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;

        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }

    location /static/ { alias /staticfiles/; }

    # Avatarlar: faqat rasm kengaytmalari beriladi, qolgani 403 (pentest 2026-10-19, 2-band).
    # Regex location prefiksdan ustun, shuning uchun ruxsat etilgan fayllar shu yerga tushadi.
    location ~* ^/media/avatars/[^/]+\.(jpe?g|png|webp)$ {
        root /;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }
    location /media/avatars/ { return 403; }
    location /media/  { alias /media/; }

    location / { try_files $uri $uri/ /index.html; }
}
